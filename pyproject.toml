[project]
name = "aisupporbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "fastapi>=0.143.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
aisupporbot = "aisupporbot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false
